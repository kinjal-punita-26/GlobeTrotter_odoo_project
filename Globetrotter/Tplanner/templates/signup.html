{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | WanderWise</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body class="auth-body">

<div class="auth-wrap">

    <a href="/"
       class="logo auth-logo">

        ✈ WanderWise

    </a>


    <div class="auth-card">

        <div class="auth-icon">
            🌍
        </div>


        <h1>
            Create your account
        </h1>

        <p>
            Start planning memorable trips in minutes.
        </p>


        <!-- Django Registration Form -->
        <form method="POST"
              action="{% url 'signup' %}">

            {% csrf_token %}


            <div class="two-inputs">

                <div>

                    <label>
                        First name
                    </label>

                    <input
                        type="text"
                        name="first_name"
                        placeholder="Priyanshi"
                        required
                    >

                </div>


                <div>

                    <label>
                        Last name
                    </label>

                    <input
                        type="text"
                        name="last_name"
                        placeholder="Patel"
                        required
                    >

                </div>

            </div>


            <label>
                Email address
            </label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >


            <label class="check terms">

                <input
                    type="checkbox"
                    name="terms"
                    required
                >

                I agree to the Terms & Privacy Policy

            </label>


            <button
                type="submit"
                class="btn btn-primary full">

                Create my account

            </button>

        </form>


        <div class="divider">
            or
        </div>


        <p class="auth-bottom">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </p>

    </div>

</div>

</body>
</html>
