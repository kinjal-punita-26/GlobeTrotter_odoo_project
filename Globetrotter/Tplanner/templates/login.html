<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | WanderWise</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-body">

<div class="auth-wrap">

    <a href="index.html" class="logo auth-logo">
        ✈ WanderWise
    </a>


    <div class="auth-card">

        <div class="auth-icon">
            👋
        </div>

        <h1>
            Welcome back
        </h1>

        <p>
            Log in to continue planning your next adventure.
        </p>


        <form action="dashboard.html">

            <label>
                Email address
            </label>

            <input
                type="email"
                placeholder="you@example.com"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                placeholder="Enter your password"
                required
            >


            <div class="form-row">

                <label class="check">

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="btn btn-primary full">

                Login to my account

            </button>

        </form>


        <div class="divider">
            or
        </div>


        <p class="auth-bottom">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </p>

    </div>

</div>

</body>
</html>
