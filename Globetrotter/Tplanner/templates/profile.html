<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | WanderWise</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<header class="navbar">

    <a href="index.html"
       class="logo">

        ✈ WanderWise

    </a>


    <nav>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="destinations.html">
            Destinations
        </a>

        <a href="create_trip.html">
            Plan Trip
        </a>

        <a href="itinerary.html">
            My Trips
        </a>

    </nav>


    <a href="profile.html"
       class="avatar">

        PP

    </a>

</header>


<main class="page narrow">


<div class="page-heading left">

    <span class="eyebrow">
        ACCOUNT
    </span>

    <h1>
        Profile settings
    </h1>

    <p>
        Manage your personal information and
        travel preferences.
    </p>

</div>


<section class="profile-card">


<div class="profile-head">

    <div class="profile-avatar">
        PP
    </div>


    <div>

        <h2>
            Priyanshi Patel
        </h2>

        <p>
            priyanshi@example.com
        </p>

    </div>


    <button class="btn btn-light">
        Change photo
    </button>

</div>


<hr>


<h3>
    Personal information
</h3>


<div class="two-inputs">

    <div>

        <label>
            First name
        </label>

        <input value="Priyanshi">

    </div>


    <div>

        <label>
            Last name
        </label>

        <input value="Patel">

    </div>

</div>


<label>
    Email
</label>

<input
    type="email"
    value="priyanshi@example.com"
>


<label>
    Home city
</label>

<input
    value="Ahmedabad, India"
>


<h3 class="section-mini">
    Travel preferences
</h3>


<label>
    Preferred travel style
</label>


<div class="choice-grid">

    <label class="choice">

        <input
            type="radio"
            name="p"
            checked
        >

        🧳 Budget

    </label>


    <label class="choice">

        <input
            type="radio"
            name="p"
        >

        ⭐ Moderate

    </label>


    <label class="choice">

        <input
            type="radio"
            name="p"
        >

        💎 Luxury

    </label>

</div>


<div class="form-actions">

    <a href="dashboard.html"
       class="btn btn-light">

        Cancel

    </a>


    <button class="btn btn-primary">

        Save changes

    </button>

</div>


</section>

</main>

</body>
</html>
