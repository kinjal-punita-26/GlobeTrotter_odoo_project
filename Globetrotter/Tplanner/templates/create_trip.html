{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Trip | WanderWise</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>


<body>


<header class="navbar">

    <a href="{% url 'index' %}"
       class="logo">

        ✈ WanderWise

    </a>


    <nav>

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'destinations' %}">
            Destinations
        </a>

        <a href="{% url 'create_trip' %}"
           class="active">

            Plan Trip

        </a>

        <a href="{% url 'dashboard' %}">
            My Trips
        </a>

    </nav>


    <a href="{% url 'profile' %}"
       class="avatar">

        PP

    </a>

</header>



<main class="page narrow">


<div class="page-heading left">

    <span class="eyebrow">
        NEW ADVENTURE
    </span>

    <h1>
        Create your trip
    </h1>

    <p>
        Tell us a little about your journey and
        we'll help you organize it.
    </p>

</div>



<div class="stepper">

    <div class="step active">

        <b>1</b>

        <span>
            Trip details
        </span>

    </div>


    <div class="line"></div>


    <div class="step">

        <b>2</b>

        <span>
            Activities
        </span>

    </div>


    <div class="line"></div>


    <div class="step">

        <b>3</b>

        <span>
            Itinerary
        </span>

    </div>

</div>



<!-- ========================= -->
<!-- CREATE TRIP FORM -->
<!-- ========================= -->

<form class="planner-card"
      method="POST"
      action="{% url 'create_trip' %}">

    {% csrf_token %}


    <h2>
        Trip details
    </h2>



    <!-- DESTINATION + TRIP NAME -->

    <div class="two-inputs">


        <div>

            <label>
                Destination
            </label>


            <select
                name="destination"
                required>

                <option value="">
                    Select destination
                </option>


                {% for destination in destinations %}

                    <option
                        value="{{ destination.id }}"
                        {% if request.GET.destination == destination.id|stringformat:"s" %}
                            selected
                        {% endif %}
                    >

                        {{ destination.name }},
                        {{ destination.country }}

                    </option>

                {% endfor %}

            </select>

        </div>



        <div>

            <label>
                Trip name
            </label>


            <input
                type="text"
                name="trip_name"
                placeholder="My dream vacation"
                required>

        </div>

    </div>



    <!-- DATES -->

    <div class="two-inputs">


        <div>

            <label>
                Start date
            </label>


            <input
                type="date"
                name="start_date"
                required>

        </div>



        <div>

            <label>
                End date
            </label>


            <input
                type="date"
                name="end_date"
                required>

        </div>

    </div>



    <!-- TRAVELERS + BUDGET -->

    <div class="two-inputs">


        <div>

            <label>
                Number of travelers
            </label>


            <input
                type="number"
                name="travelers"
                min="1"
                value="2"
                required>

        </div>



        <div>

            <label>
                Budget (₹)
            </label>


            <input
                type="number"
                name="budget"
                min="0"
                placeholder="50000"
                required>

        </div>

    </div>



    <!-- TRAVEL STYLE -->

    <label>
        Travel style
    </label>


    <div class="choice-grid">


        <label class="choice">

            <input
                type="radio"
                name="travel_style"
                value="budget">

            🧳 Budget

        </label>



        <label class="choice">

            <input
                type="radio"
                name="travel_style"
                value="moderate"
                checked>

            ⭐ Moderate

        </label>



        <label class="choice">

            <input
                type="radio"
                name="travel_style"
                value="luxury">

            💎 Luxury

        </label>

    </div>



    <!-- INTERESTS -->

    <label>
        Interests
    </label>


    <div class="choice-grid">


        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Culture">

            🏛️ Culture

        </label>



        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Beaches">

            🏖️ Beaches

        </label>



        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Food">

            🍜 Food

        </label>



        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Adventure">

            🥾 Adventure

        </label>



        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Shopping">

            🛍️ Shopping

        </label>



        <label class="choice">

            <input
                type="checkbox"
                name="interests"
                value="Nature">

            🌿 Nature

        </label>

    </div>



    <!-- NOTES -->

    <label>
        Notes
    </label>


    <textarea
        name="notes"
        rows="4"
        placeholder="Anything important about your trip?"
    ></textarea>



    <!-- BUTTONS -->

    <div class="form-actions">


        <a href="{% url 'dashboard' %}"
           class="btn btn-light">

            Cancel

        </a>



        <button
            type="submit"
            class="btn btn-primary">

            Continue →

        </button>

    </div>


</form>


</main>


</body>

</html>
